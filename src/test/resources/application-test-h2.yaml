spring.cache.type: none
spring:
  init:
    mode: always
  datasource:
    url: jdbc:h2:mem:mydb-h2-test/public
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
logging:
  level:
    root: debug
